<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineNoir — Selecionar Assento</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#070608; --surface:#0e0809; --surface2:#150b0b;
      --red:#cc2222; --red-light:#e03333;
      --cream:#f5e8e8; --muted:#5a5a65; --muted2:#3a1a1a; --text:#ddd8cc;
    }
    html,body { min-height:100vh; background:var(--bg); font-family:'DM Sans',sans-serif; font-weight:300; color:var(--text); }
    body::before {
      content:''; position:fixed; inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events:none; z-index:9999; opacity:.3;
    }

    /* NAV */
    nav {
      position:fixed; top:0; left:0; right:0;
      display:flex; align-items:center; justify-content:space-between;
      padding:1rem 3rem; z-index:50;
      background:rgba(7,6,8,.97); border-bottom:1px solid var(--muted2);
    }
    .logo { font-family:'Bebas Neue',sans-serif; font-size:1.4rem; letter-spacing:.15em; color:var(--red); text-decoration:none; }
    .logo span { color:var(--cream); }
    .btn-voltar { font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); border:1px solid var(--muted2); padding:.35rem .9rem; border-radius:2px; transition:all .2s; cursor:pointer; background:none; }
    .btn-voltar:hover { border-color:var(--cream); color:var(--cream); }

    /* PAGE */
    .page { display:flex; min-height:100vh; padding-top:56px; }

    /* LEFT: seat map */
    .left { flex:1; padding:2rem 2.5rem; overflow-y:auto; }
    .map-center { display:flex; flex-direction:column; align-items:center; }
    .map-wrap { display:inline-flex; flex-direction:column; }

    /* SESSION HEADER */
    .session-header {
      display:flex; align-items:center; gap:1.25rem;
      margin-bottom:2rem; padding-bottom:1.5rem;
      border-bottom:1px solid var(--muted2);
    }
    .session-poster { width:60px; height:85px; object-fit:cover; border-radius:2px; border:1px solid var(--muted2); flex-shrink:0; }
    .session-title { font-family:'Cormorant Garamond',serif; font-size:1.5rem; font-weight:300; color:var(--cream); margin-bottom:.25rem; }
    .session-meta { display:flex; gap:.75rem; align-items:center; font-size:.75rem; color:var(--muted); flex-wrap:wrap; }
    .badge { display:inline-block; padding:.18rem .5rem; border-radius:2px; font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; }
    .badge-gray { background:rgba(90,90,101,.1); color:var(--muted); border:1px solid var(--muted2); }


    /* SUGESTÃO */
    .sugestao-row {
      display:flex; align-items:center; gap:.75rem;
      margin-bottom:1rem; flex-wrap:wrap;
    }
    .sugestao-label { font-size:.72rem; color:var(--muted); letter-spacing:.04em; }
    .sugestao-ctrl { display:flex; align-items:center; gap:.4rem; }
    .sq-btn {
      width:26px; height:26px; border-radius:2px;
      border:1px solid var(--muted2); background:var(--surface2);
      color:var(--cream); cursor:pointer; font-size:.9rem;
      display:flex; align-items:center; justify-content:center;
      transition:border-color .2s; line-height:1;
    }
    .sq-btn:hover { border-color:var(--red); }
    .sq-num { font-family:'Cormorant Garamond',serif; font-size:1.2rem; color:var(--cream); min-width:20px; text-align:center; }
    .btn-sugerir {
      background:none; border:1px solid var(--muted2); color:var(--muted);
      padding:.35rem .9rem; border-radius:2px; cursor:pointer;
      font-family:'DM Sans',sans-serif; font-size:.7rem; letter-spacing:.1em;
      text-transform:uppercase; transition:all .2s;
    }
    .btn-sugerir:hover { border-color:var(--red); color:var(--red); }

    /* SCREEN */
    .screen-wrap { text-align:center; margin-bottom:1.5rem; }
    .screen { display:inline-block; width:60%; height:5px; background:linear-gradient(to bottom, rgba(245,232,232,.2), transparent); border-radius:50% 50% 0 0 / 8px 8px 0 0; margin-bottom:.4rem; }
    .screen-label { font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }

    /* COL NUMBERS */
    .col-numbers { display:flex; gap:.35rem; padding-left:24px; margin-bottom:.3rem; }
    .col-num { width:26px; text-align:center; font-size:.55rem; color:var(--muted); flex-shrink:0; }

    /* SEAT MAP */
    .seat-map { display:flex; flex-direction:column; gap:.4rem; align-items:flex-start; margin-bottom:1.5rem; }
    .seat-row { display:flex; gap:.35rem; align-items:center; }
    .row-label { width:18px; font-size:.65rem; color:var(--muted); text-align:center; flex-shrink:0; }
    .seat {
      width:26px; height:22px; border-radius:3px 3px 0 0;
      border:1px solid var(--muted2); background:var(--surface2);
      cursor:pointer; transition:all .15s; flex-shrink:0;
    }
    .seat:hover:not(.occupied):not(.selected) { border-color:rgba(204,34,34,.5); background:rgba(204,34,34,.1); }
    .seat.selected { background:var(--red); border-color:var(--red); }
    .seat.occupied { background:var(--muted2); border-color:var(--muted2); cursor:not-allowed; opacity:.5; }

    /* LEGEND */
    .legend { display:flex; gap:1.5rem; margin-bottom:1rem; padding-left:24px; }
    .legend-item { display:flex; align-items:center; gap:.4rem; font-size:.68rem; color:var(--muted); }
    .legend-dot { width:14px; height:12px; border-radius:2px 2px 0 0; border:1px solid; }
    .legend-dot.free { background:var(--surface2); border-color:var(--muted2); }
    .legend-dot.sel  { background:var(--red); border-color:var(--red); }
    .legend-dot.occ  { background:var(--muted2); border-color:var(--muted2); opacity:.5; }

    /* RIGHT: summary */
    .right {
      width:280px; flex-shrink:0;
      background:var(--surface); border-left:1px solid var(--muted2);
      padding:1.5rem 1.25rem;
      position:sticky; top:56px; height:calc(100vh - 56px);
      display:flex; flex-direction:column; gap:.85rem;
      overflow:hidden;
    }

    .sum-title { font-family:'Cormorant Garamond',serif; font-size:1.1rem; font-weight:300; color:var(--cream); padding-bottom:.6rem; border-bottom:1px solid var(--muted2); flex-shrink:0; }
    .sum-label { font-size:.58rem; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); margin-bottom:.2rem; }
    .sum-value { font-size:.82rem; color:var(--cream); }

    .seats-tags { display:flex; flex-wrap:wrap; gap:.3rem; min-height:22px; }
    .seat-tag { background:rgba(204,34,34,.1); border:1px solid rgba(204,34,34,.25); color:var(--red); border-radius:2px; padding:.15rem .4rem; font-size:.65rem; }
    .seats-empty { font-size:.75rem; color:var(--muted); font-style:italic; }

    .desconto-box { background:rgba(204,34,34,.06); border:1px solid rgba(204,34,34,.2); border-radius:2px; padding:.4rem .65rem; font-size:.65rem; color:var(--red); flex-shrink:0; }

    .price-box { background:var(--surface2); border:1px solid var(--muted2); border-radius:3px; padding:.7rem .85rem; flex-shrink:0; }
    .price-row { display:flex; justify-content:space-between; font-size:.72rem; color:var(--muted); margin-bottom:.25rem; }
    .price-total { display:flex; justify-content:space-between; font-size:.88rem; color:var(--cream); padding-top:.35rem; border-top:1px solid var(--muted2); margin-top:.25rem; }
    .price-total span:last-child { color:var(--red); font-family:'Cormorant Garamond',serif; font-size:1.1rem; }

    .btn-confirmar {
      width:100%; background:var(--red); color:#fff; border:none;
      padding:.8rem; font-family:'DM Sans',sans-serif;
      font-size:.78rem; font-weight:500; letter-spacing:.12em;
      text-transform:uppercase; border-radius:2px; cursor:pointer;
      transition:background .2s; margin-top:auto; flex-shrink:0;
    }
    .btn-confirmar:hover { background:var(--red-light); }
    .btn-confirmar:disabled { background:var(--muted2); cursor:not-allowed; }

    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:200; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--surface); border:1px solid var(--muted2); border-radius:4px; width:min(440px,92vw); overflow:hidden; animation:slideUp .25s ease; }
    @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .modal-head { padding:1.1rem 1.5rem; border-bottom:1px solid var(--muted2); }
    .modal-head h3 { font-family:'Cormorant Garamond',serif; font-size:1.3rem; font-weight:300; color:var(--cream); }
    .modal-body { padding:1.4rem 1.5rem; display:flex; flex-direction:column; gap:.6rem; }
    .confirm-row { display:flex; justify-content:space-between; font-size:.82rem; }
    .confirm-row span:first-child { color:var(--muted); }
    .confirm-row span:last-child { color:var(--cream); }
    .confirm-total { display:flex; justify-content:space-between; padding-top:.6rem; border-top:1px solid var(--muted2); margin-top:.2rem; }
    .confirm-total span:first-child { font-size:.82rem; color:var(--muted); }
    .confirm-total span:last-child { color:var(--red); font-family:'Cormorant Garamond',serif; font-size:1.3rem; }
    .modal-foot { padding:.9rem 1.5rem; border-top:1px solid var(--muted2); display:flex; gap:.75rem; justify-content:flex-end; }
    .btn-cancel { background:none; border:1px solid var(--muted2); color:var(--muted); padding:.55rem 1.2rem; font-family:'DM Sans',sans-serif; font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; border-radius:2px; cursor:pointer; transition:all .2s; }
    .btn-cancel:hover { border-color:var(--cream); color:var(--cream); }
    .btn-pay { background:var(--red); color:#fff; border:none; padding:.55rem 1.5rem; font-family:'DM Sans',sans-serif; font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; border-radius:2px; cursor:pointer; transition:background .2s; }
    .btn-pay:hover { background:var(--red-light); }

    /* SUCCESS inside modal */
    .success-screen { text-align:center; padding:1.5rem; }
    .success-icon { font-size:2rem; display:block; margin-bottom:.75rem; }
    .success-title { font-family:'Cormorant Garamond',serif; font-size:1.6rem; font-weight:300; color:var(--cream); margin-bottom:.4rem; }
    .success-sub { font-size:.78rem; color:var(--muted); line-height:1.6; margin-bottom:1rem; }
    .ticket-code { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; letter-spacing:.25em; color:var(--red); background:rgba(204,34,34,.08); border:1px dashed rgba(204,34,34,.3); padding:.6rem 1.25rem; border-radius:2px; margin-bottom:1rem; display:inline-block; }

    @media(max-width:700px) {
      nav { padding:1rem 1.25rem; }
      .page { flex-direction:column; }
      .left { padding:1.25rem; }
      .right { width:100%; position:static; height:auto; border-left:none; border-top:1px solid var(--muted2); }
      .seat { width:22px; height:19px; }
      .col-num { width:22px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="#" onclick="goBack()" class="logo">Cine<span>Noir</span></a>
  <button class="btn-voltar" onclick="goBack()">← Voltar</button>
</nav>

<div class="page">
  <div class="left">
    <div class="session-header">
      <img class="session-poster" id="sessionPoster" src="" alt="">
      <div>
        <h2 class="session-title" id="sessionFilme">—</h2>
        <div class="session-meta" id="sessionMeta"></div>
      </div>
    </div>

    <div class="screen-wrap">
      <div class="screen"></div><br>
      <span class="screen-label">Tela</span>
    </div>

    <div class="map-center">
      <div class="map-wrap">
        <!-- Sugestão automática: Sala.sugestaoAssentos(sessao, quantidade) -->
    <div class="sugestao-row">
      <span class="sugestao-label">Sugerir assentos juntos:</span>
      <div class="sugestao-ctrl">
        <button class="sq-btn" onclick="changeSug(-1)">−</button>
        <span class="sq-num" id="sugNum">2</span>
        <button class="sq-btn" onclick="changeSug(1)">+</button>
      </div>
      <button class="btn-sugerir" onclick="sugerirAssentos()">Sugerir</button>
    </div>

    <div class="col-numbers" id="colNumbers"></div>
        <div class="seat-map" id="seatMap"></div>
      </div>
      <div class="legend">
      <div class="legend-item"><div class="legend-dot free"></div> Livre</div>
      <div class="legend-item"><div class="legend-dot sel"></div> Selecionado</div>
      <div class="legend-item"><div class="legend-dot occ"></div> Ocupado</div>
      </div>
    </div>
  </div>

  <div class="right">
    <p class="sum-title">Resumo</p>

    <div>
      <p class="sum-label">Sessão</p>
      <p class="sum-value" id="sumSessao">—</p>
    </div>

    <div>
      <p class="sum-label">Assentos selecionados</p>
      <div class="seats-tags" id="sumAssentos">
        <span class="seats-empty">Nenhum selecionado</span>
      </div>
    </div>

    <div class="desconto-box" id="descontoBox" style="display:none"></div>

    <div class="price-box">
      <div class="price-row"><span>Ingresso base</span><span id="pBase">—</span></div>
      <div class="price-row"><span id="pSalaLabel">Sala</span><span id="pMult">—</span></div>
      <div class="price-row" id="pDescontoRow" style="display:none"><span>Desconto</span><span id="pDesconto" style="color:#2ecc71">—</span></div>
      <div class="price-row"><span>Qtd. ingressos</span><span id="pQtd">0</span></div>
      <div class="price-total"><span>Total</span><span id="pTotal">R$ 0,00</span></div>
    </div>

    <button class="btn-confirmar" id="btnConfirmar" onclick="openConfirm()" disabled>Confirmar Compra →</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head"><h3>Confirmar compra</h3></div>
    <div class="modal-body" id="confirmBody"></div>
    <div class="modal-foot" id="confirmFoot">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-pay" onclick="confirmarCompra()">Pagar →</button>
    </div>
  </div>
</div>

const SALA_TIPOS = {
  COMUM:  { label:'Comum',  mult:1.0 },
  SALA3D: { label:'3D',     mult:1.2 },
  XD:     { label:'XD',     mult:1.3 },
  XD3D:   { label:'XD/3D',  mult:1.4 },
};

const DESCONTO = { usuario:0, estudante:50, critico:100 };

const filme   = FILMES.find(f => f.id === filmeId) || FILMES[0];
const salaInfo = SALA_TIPOS[sala] || SALA_TIPOS.XD;
const descPct  = DESCONTO[tipo] || 0;

const ROWS = 10, COLS = 15;
const LETRAS = 'ABCDEFGHIJ';

// Pre-occupied seats
const occupied = new Set(['0-2','0-3','0-4','1-7','1-8','2-0','2-14','3-5','3-6','4-10','4-11','5-3','6-8','7-2','7-12','8-6','9-0','9-14']);
const selectedSeats = new Set();

// ── INIT HEADER ─────────────────────────────────────────────────────────────
document.getElementById('sessionPoster').src = filme.poster;
document.getElementById('sessionFilme').textContent = filme.nome;
document.getElementById('sessionMeta').innerHTML =
  `<span>${horario}</span><span>·</span><span>${data}</span><span>·</span><span class="badge badge-gray">${salaInfo.label}</span><span class="badge badge-gray">${filme.class}</span>`;
document.getElementById('sumSessao').textContent = `${horario} · ${salaInfo.label} · ${data}`;
document.title = `CineNoir — ${filme.nome} · ${horario}`;

// Desconto info
if (descPct > 0) {
  const box = document.getElementById('descontoBox');
  box.style.display = 'block';
  box.textContent = tipo === 'critico'
    ? '✦ Crítico: ingresso gratuito (100% de desconto)'
    : `✦ Estudante: ${descPct}% de desconto`;
  document.getElementById('pDescontoRow').style.display = 'flex';
}

// ── RENDER SEAT MAP ──────────────────────────────────────────────────────────
const colNums = document.getElementById('colNumbers');
for (let c = 0; c < COLS; c++) {
  const el = document.createElement('div');
  el.className = 'col-num';
  el.textContent = c + 1;
  colNums.appendChild(el);
}

const map = document.getElementById('seatMap');
for (let r = 0; r < ROWS; r++) {
  const row = document.createElement('div');
  row.className = 'seat-row';
  const label = document.createElement('div');
  label.className = 'row-label';
  label.textContent = LETRAS[r];
  row.appendChild(label);
  for (let c = 0; c < COLS; c++) {
    const key = `${r}-${c}`;
    const seat = document.createElement('div');
    seat.className = 'seat' + (occupied.has(key) ? ' occupied' : '');
    seat.dataset.r = r; seat.dataset.c = c;
    seat.title = `${LETRAS[r]}${c+1}`;
    if (!occupied.has(key)) seat.addEventListener('click', () => toggleSeat(r, c, seat));
    row.appendChild(seat);
  }
  map.appendChild(row);
}

// ── TOGGLE SEAT ──────────────────────────────────────────────────────────────
function toggleSeat(r, c, el) {
  const key = `${r}-${c}`;
  if (selectedSeats.has(key)) { selectedSeats.delete(key); el.classList.remove('selected'); }
  else { selectedSeats.add(key); el.classList.add('selected'); }
  updateSummary();
}

// ── SUMMARY ──────────────────────────────────────────────────────────────────
function updateSummary() {
  const n = selectedSeats.size;
  const container = document.getElementById('sumAssentos');
  if (n === 0) {
    container.innerHTML = '<span class="seats-empty">Nenhum selecionado</span>';
  } else {
    container.innerHTML = [...selectedSeats].sort().map(k => {
      const [r,c] = k.split('-').map(Number);
      return `<span class="seat-tag">${LETRAS[r]}${c+1}</span>`;
    }).join('');
  }

  const precoUnit  = filme.valor * salaInfo.mult;
  const descFator  = 1 - descPct / 100;
  const precoFinal = precoUnit * descFator;
  const total      = precoFinal * n;

  document.getElementById('pBase').textContent     = fmt(filme.valor);
  document.getElementById('pSalaLabel').textContent = `Sala (${salaInfo.label} ×${salaInfo.mult})`;
  document.getElementById('pMult').textContent      = fmt(precoUnit);
  document.getElementById('pDesconto').textContent  = `-${descPct}%`;
  document.getElementById('pQtd').textContent       = n;
  document.getElementById('pTotal').textContent     = fmt(total);
  document.getElementById('btnConfirmar').disabled  = n === 0;
}

// ── CONFIRM ──────────────────────────────────────────────────────────────────
function openConfirm() {
  if (!usuario) { window.location.href = 'login.html'; return; }
  if (selectedSeats.size === 0) return;

  const n = selectedSeats.size;
  const seats = [...selectedSeats].sort().map(k => {
    const [r,c] = k.split('-').map(Number); return `${LETRAS[r]}${c+1}`;
  }).join(', ');
  const precoFinal = filme.valor * salaInfo.mult * (1 - descPct/100);
  const total = precoFinal * n;

  document.getElementById('confirmBody').innerHTML = `
    <div class="confirm-row"><span>Filme</span><span>${filme.nome}</span></div>
    <div class="confirm-row"><span>Data/Horário</span><span>${data} · ${horario}</span></div>
    <div class="confirm-row"><span>Sala</span><span>${salaInfo.label}</span></div>
    <div class="confirm-row"><span>Assentos</span><span>${seats}</span></div>
    <div class="confirm-row"><span>Qtd.</span><span>${n} ingresso(s)</span></div>
    ${descPct > 0 ? `<div class="confirm-row"><span>Desconto</span><span style="color:#2ecc71">-${descPct}%</span></div>` : ''}
    <div class="confirm-total"><span>Total</span><span>${fmt(total)}</span></div>`;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function confirmarCompra() {
  const seatLabels = [...selectedSeats].sort().map(k => {
    const [r,c] = k.split('-').map(Number); return `${LETRAS[r]}${c+1}`;
  });
  const code = 'CN' + Date.now().toString(36).toUpperCase().slice(-6);
  const precoUnit  = filme.valor * salaInfo.mult * (1 - descPct/100);
  const bilhete = {
    filmeId, filme: filme.nome,
    horario, sala, salaLabel: `${salaInfo.label} (×${salaInfo.mult})`,
    data, assentos: seatLabels,
    valorUnit: precoUnit,
    valorTotal: parseFloat((precoUnit * seatLabels.length).toFixed(2))
  };
  const carrinhoUrl = `carrinho.html?usuario=${encodeURIComponent(usuario)}&tipo=${tipo}&bilhetes=${encodeURIComponent(JSON.stringify([bilhete]))}`;

  // Mark seats occupied
  selectedSeats.forEach(key => {
    occupied.add(key);
    const [r,c] = key.split('-').map(Number);
    const el = document.querySelector(`.seat[data-r="${r}"][data-c="${c}"]`);
    if (el) { el.classList.remove('selected'); el.classList.add('occupied'); }
  });
  selectedSeats.clear();
  updateSummary();

  document.getElementById('confirmBody').innerHTML = `
    <div class="success-screen">
      <span class="success-icon">✦</span>
      <h2 class="success-title">Compra confirmada!</h2>
      <p class="success-sub">Ingressos reservados.<br>Apresente o código na entrada.</p>
      <div class="ticket-code">${code}</div>
      <p style="font-size:.7rem;color:var(--muted);margin-bottom:1rem;">Assentos: ${seatLabels.join(', ')}</p>
      <a href="${carrinhoUrl}" style="display:block;background:var(--red);color:#fff;padding:.7rem;border-radius:2px;text-decoration:none;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;margin-bottom:.5rem">Adicionar produtos →</a>
      <a href="index.html?usuario=${encodeURIComponent(usuario)}&tipo=${tipo}" style="display:block;color:var(--muted);font-size:.72rem;text-align:center;text-decoration:none;letter-spacing:.08em">Voltar ao início</a>
    </div>`;
  document.getElementById('confirmFoot').style.display = 'none';
}

function fmt(v) { return 'R$ ' + (v||0).toFixed(2).replace('.', ','); }
function showToast(msg, isError=false) {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:2rem;right:2rem;background:var(--surface);border:1px solid ${isError?'rgba(204,34,34,.5)':'rgba(46,204,113,.4)'};color:${isError?'var(--red)':'#2ecc71'};padding:.75rem 1.5rem;border-radius:3px;font-size:.82rem;z-index:300`;
  t.textContent = (isError?'✕ ':'✓ ') + msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}


// ── SUGESTÃO DE ASSENTOS: Sala.sugestaoAssentos(sessao, quantidade) ──────────
let sugQty = 2;

function changeSug(delta) {
  sugQty = Math.max(1, Math.min(10, sugQty + delta));
  document.getElementById('sugNum').textContent = sugQty;
}

function sugerirAssentos() {
  // Espelha Sala.sugestaoAssentos() — busca N assentos livres e juntos na mesma fileira
  // boolean[][] assentos — percorre linha por linha
  let found = null;

  outer:
  for (let r = 0; r < ROWS; r++) {
    let cont = 0;
    let startCol = -1;
    for (let c = 0; c < COLS; c++) {
      const key = `${r}-${c}`;
      if (!occupied.has(key)) {
        if (cont === 0) startCol = c;
        cont++;
        if (cont === sugQty) {
          found = { r, startCol, endCol: c };
          break outer;
        }
      } else {
        cont = 0; startCol = -1;
      }
    }
  }

  if (!found) {
    showToast(`Não há ${sugQty} assentos juntos disponíveis.`, true);
    return;
  }

  // Deselect all current selections
  selectedSeats.forEach(key => {
    const [r, c] = key.split('-').map(Number);
    const el = document.querySelector(`.seat[data-r="${r}"][data-c="${c}"]`);
    if (el) el.classList.remove('selected');
  });
  selectedSeats.clear();

  // Select suggested seats
  for (let c = found.startCol; c <= found.endCol; c++) {
    const key = `${found.r}-${c}`;
    selectedSeats.add(key);
    const el = document.querySelector(`.seat[data-r="${found.r}"][data-c="${c}"]`);
    if (el) el.classList.add('selected');
  }

  const labels = Array.from(selectedSeats).sort().map(k => {
    const [r, c] = k.split('-').map(Number);
    return `${LETRAS[r]}${c + 1}`;
  }).join(', ');

  showToast(`Sugestão: ${labels}`);
  updateSummary();

  // Scroll seat into view
  const firstEl = document.querySelector(`.seat[data-r="${found.r}"][data-c="${found.startCol}"]`);
  if (firstEl) firstEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

updateSummary();
</script>
</body>
</html>
