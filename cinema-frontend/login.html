<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineNoir — Entrar</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #070608;
      --surface:  #0e0809;
      --surface2: #150b0b;
      --red:      #cc2222;
      --red-light:#e03333;
      --cream:    #f5e8e8;
      --muted:    #5a5a65;
      --muted2:   #3a1a1a;
      --text:     #ddd8cc;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* grain */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: .3;
    }

    /* ── CARD ── */
    .login-card {
      display: flex;
      width: min(900px, 95vw);
      height: min(580px, 90vh);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 60px 120px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04);
      animation: fadeUp .7s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── LEFT PANEL ── */
    .panel-left {
      position: relative;
      flex: 1.1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem;
    }

    .panel-left-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 30% 20%, rgba(180,20,20,.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 70% 80%, rgba(100,10,10,.25) 0%, transparent 55%),
        linear-gradient(145deg, #110506 0%, #0a0305 40%, #0e0608 100%);
    }

    /* ── RIGHT PANEL ── */
    .panel-right {
      flex: 1;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem 2.8rem;
      border-left: 1px solid var(--muted2);
    }

    .form-top { flex: 1; display: flex; flex-direction: column; justify-content: center; }

    .form-icon {
      font-size: 1.6rem;
      margin-bottom: 1rem;
      color: var(--red);
      display: block;
    }

    .form-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 300;
      color: var(--cream);
      margin-bottom: .3rem;
    }

    .form-sub {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .form-sub a {
      color: var(--red);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
    }

    .form-sub a:hover { border-color: var(--red); }

    /* fields */
    .field {
      position: relative;
      margin-bottom: 1rem;
    }

    .field input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--muted2);
      border-radius: 3px;
      padding: .85rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      color: var(--cream);
      outline: none;
      transition: border-color .2s, background .2s;
    }

    .field input::placeholder { color: var(--muted); }

    .field input:focus {
      border-color: var(--red);
      background: rgba(204,34,34,.04);
    }

    .field-label {
      position: absolute;
      top: 50%; left: 1rem;
      transform: translateY(-50%);
      font-size: .82rem;
      color: var(--muted);
      pointer-events: none;
      transition: all .2s;
    }

    .field input:not(:placeholder-shown) + .field-label,
    .field input:focus + .field-label {
      top: -.6rem; left: .75rem;
      font-size: .65rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      background: var(--surface2);
      padding: 0 .3rem;
      color: var(--red);
    }

    .eye-btn {
      position: absolute; right: .8rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: .9rem; line-height: 1;
      transition: color .2s;
    }
    .eye-btn:hover { color: var(--cream); }

    /* row for extra fields on cadastro */
    .field-row { display: flex; gap: .75rem; }
    .field-row .field { flex: 1; }

    .type-select {
      display: flex; gap: .6rem;
      margin-bottom: 1rem;
    }

    .type-btn {
      flex: 1;
      padding: .65rem;
      background: var(--surface2);
      border: 1px solid var(--muted2);
      border-radius: 3px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .2s;
    }

    .type-btn.active {
      border-color: var(--red);
      color: var(--red);
      background: rgba(204,34,34,.06);
    }

    .btn-submit {
      width: 100%;
      background: var(--red);
      color: #fff;
      border: none;
      padding: .9rem;
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      border-radius: 3px;
      cursor: pointer;
      margin-top: .25rem;
      transition: background .2s, transform .15s;
    }

    .btn-submit:hover { background: var(--red-light); transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }

    .forgot {
      text-align: center;
      margin-top: .9rem;
      font-size: .75rem;
      color: var(--muted);
    }

    .forgot a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--muted2);
      transition: color .2s, border-color .2s;
    }

    .forgot a:hover { color: var(--cream); border-color: var(--cream); }

    

    

    

    /* panel switching */
    .form-panel { display: none; }
    .form-panel.active { display: block; }

    /* back link */
    .back-link {
      position: fixed; top: 1.5rem; left: 2rem;
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      display: flex; align-items: center; gap: .5rem;
      transition: color .2s;
      z-index: 10;
    }
    .back-link:hover { color: var(--cream); }

    @media (max-width: 640px) {
      .panel-left { display: none; }
      .panel-right { padding: 2rem 1.5rem; }
      .login-card { width: 100vw; height: 100dvh; border-radius: 0; }
    }
  </style>
</head>
<body>

<a href="index.html" class="back-link">← Voltar</a>

<div class="login-card">

  <!-- LEFT -->
  <div class="panel-left">
    <div class="panel-left-bg"></div>

    <div class="panel-left-content">
      <div class="panel-logo">Cine<span>Noir</span></div>
      <div class="panel-copy">
        <p class="panel-eyebrow">Temporada 2026</p>
        <h2 class="panel-headline">Cine<em>Noir</em></h2>
        <p class="panel-tagline">Entre na sua conta e reserve sua sessão. A tela espera por você.</p>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="panel-right">
    <div class="form-top">

      <span class="form-icon">✦</span>
      <h1 class="form-title" id="formTitle">Entrar</h1>




      <!-- LOGIN -->
      <div class="form-panel active" id="panelLogin">
        <div class="field">
          <input type="text" id="loginUser" placeholder=" " autocomplete="username" />
          <label class="field-label" for="loginUser">Usuário ou e-mail</label>
        </div>
        <div class="field">
          <input type="password" id="loginPass" placeholder=" " autocomplete="current-password" />
          <label class="field-label" for="loginPass">Senha</label>
          <button class="eye-btn" type="button" onclick="togglePass('loginPass', this)">👁</button>
        </div>
        <button class="btn-submit" onclick="handleLogin()">Entrar →</button>
        <p class="forgot"><a href="esqueci-senha.html">Esqueci minha senha</a></p>
        <p class="forgot" style="margin-top:.5rem;">Não tem conta? <a href="cadastro.html">Cadastro</a></p>
      </div>

      <!-- CADASTRO -->
      <div class="form-panel" id="panelCadastro">
        <div class="field-row">
          <div class="field">
            <input type="text" id="regUser" placeholder=" " />
            <label class="field-label" for="regUser">Usuário</label>
          </div>
          <div class="field">
            <input type="number" id="regIdade" placeholder=" " min="1" max="120" />
            <label class="field-label" for="regIdade">Idade</label>
          </div>
        </div>
        <div class="field">
          <input type="email" id="regEmail" placeholder=" " />
          <label class="field-label" for="regEmail">E-mail</label>
        </div>
        <div class="field">
          <input type="password" id="regSenha" placeholder=" " />
          <label class="field-label" for="regSenha">Senha</label>
          <button class="eye-btn" type="button" onclick="togglePass('regSenha', this)">👁</button>
        </div>
        <div class="type-select">
          <button class="type-btn active" data-type="usuario" onclick="selectType(this)">Usuário</button>
          <button class="type-btn" data-type="estudante" onclick="selectType(this)">Estudante <small style="opacity:.6">−50%</small></button>
          <button class="type-btn" data-type="critico" onclick="selectType(this)">Crítico</button>
        </div>
        <button class="btn-submit" onclick="handleCadastro()">Criar Conta →</button>
      </div>

    </div>

    
  </div>
</div>

<script>
  function togglePass(id, btn) {
    const input = document.getElementById(id);
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.textContent = showing ? '👁' : '🙈';
  }

  function selectType(btn) {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function handleLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!user || !pass) { shake('panelLogin'); return; }

    // TODO: POST /api/auth/login
    let tipo = 'usuario';
    if (user.toLowerCase() === 'admin') tipo = 'admin';
    else if (user.toLowerCase() === 'func') tipo = 'funcionario';
    else if (user.toLowerCase() === 'critico') tipo = 'critico';

    if (tipo === 'admin' || tipo === 'funcionario') {
      window.location.href = 'painel.html?usuario=' + encodeURIComponent(user) + '&tipo=' + tipo;
    } else if (tipo === 'critico') {
      window.location.href = 'critico.html?usuario=' + encodeURIComponent(user) + '&tipo=critico&origem=' + encodeURIComponent('Veículo do Crítico');
    } else {
      window.location.href = 'index.html?usuario=' + encodeURIComponent(user) + '&tipo=' + tipo;
    }
  }

  function handleCadastro() {
    const user  = document.getElementById('regUser').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const senha = document.getElementById('regSenha').value;
    const idade = document.getElementById('regIdade').value;
    const tipo  = document.querySelector('.type-btn.active')?.dataset.type || 'usuario';
    if (!user || !email || !senha || !idade) { shake('panelCadastro'); return; }
    // TODO: POST /api/auth/cadastro
    alert('Cadastro: ' + user + ' (' + tipo + ')');
  }

  function shake(id) {
    const el = document.getElementById(id);
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = 'shake .35s ease';
  }
</script>

<style>
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-6px); }
    60%      { transform: translateX(6px); }
    80%      { transform: translateX(-3px); }
  }
</style>

</body>
</html>
