<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineNoir — Filmes</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #070608;
      --surface:  #0e0809;
      --surface2: #150b0b;
      --red:      #cc2222;
      --red-light:#e03333;
      --cream:    #f5e8e8;
      --muted:    #5a5a65;
      --muted2:   #3a1a1a;
      --text:     #ddd8cc;
    }

    html, body { min-height: 100vh; background: var(--bg); font-family: 'DM Sans', sans-serif; font-weight: 300; color: var(--text); overflow-x: hidden; }

    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999; opacity: .3;
    }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 3rem; z-index: 50;
      background: rgba(7,6,8,.95);
      border-bottom: 1px solid var(--muted2);
    }

    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: .15em; color: var(--red); text-decoration: none; }
    .logo span { color: var(--cream); }

    .nav-back { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-decoration: none; border: 1px solid var(--muted2); padding: .35rem .9rem; border-radius: 2px; transition: all .2s; }
    .nav-back:hover { border-color: var(--cream); color: var(--cream); }

    /* FILM LIST - left sidebar */
    .layout { display: flex; min-height: 100vh; padding-top: 56px; }

    .sidebar {
      width: 280px; flex-shrink: 0;
      position: sticky; top: 56px; height: calc(100vh - 56px);
      overflow-y: auto; overflow-x: hidden;
      background: var(--surface);
      border-right: 1px solid var(--muted2);
      scrollbar-width: thin; scrollbar-color: var(--muted2) transparent;
    }

    .sidebar-title {
      padding: 1.25rem 1.5rem .75rem;
      font-size: .6rem; letter-spacing: .2em;
      text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--muted2);
    }

    .film-thumb-item {
      display: flex; align-items: center; gap: .85rem;
      padding: .85rem 1.25rem;
      cursor: pointer; border-left: 2px solid transparent;
      transition: all .2s; border-bottom: 1px solid rgba(58,26,26,.3);
    }
    .film-thumb-item:hover { background: rgba(204,34,34,.04); border-left-color: rgba(204,34,34,.3); }
    .film-thumb-item.active { background: rgba(204,34,34,.08); border-left-color: var(--red); }

    .thumb-img { width: 38px; height: 54px; object-fit: cover; border-radius: 2px; flex-shrink: 0; }

    .thumb-info-nome { font-size: .82rem; color: var(--cream); line-height: 1.3; margin-bottom: .15rem; }
    .thumb-info-meta { font-size: .65rem; color: var(--muted); }
    .thumb-nota { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--red); flex-shrink: 0; margin-left: auto; }

    /* DETAIL */
    .detail { flex: 1; min-width: 0; }

    /* HERO */
    .hero-section {
      position: relative; height: 65vh; min-height: 400px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      transition: background-image .4s ease;
      filter: brightness(.45) saturate(.8);
    }

    .hero-overlay {
      position: absolute; inset: 0;
      background:
        linear-gradient(to right, rgba(7,6,8,.9) 0%, rgba(7,6,8,.4) 50%, transparent 100%),
        linear-gradient(to top, rgba(7,6,8,1) 0%, transparent 40%);
    }

    .hero-content {
      position: absolute; bottom: 0; left: 0;
      padding: 3rem;
      max-width: 600px;
    }

    .hero-genero {
      font-size: .62rem; letter-spacing: .2em;
      text-transform: uppercase; color: var(--red);
      margin-bottom: .6rem;
      display: flex; align-items: center; gap: .5rem;
    }
    .hero-genero::before { content: '✦'; font-size: .5rem; }

    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      letter-spacing: .06em; color: var(--cream);
      line-height: .95; margin-bottom: .75rem;
    }

    .hero-meta {
      display: flex; gap: 1rem; align-items: center;
      font-size: .75rem; color: var(--muted);
      margin-bottom: 1rem; flex-wrap: wrap;
    }

    .badge { display: inline-block; padding: .2rem .55rem; border-radius: 2px; font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; }
    .badge-red  { background: rgba(204,34,34,.15); color: var(--red);   border: 1px solid rgba(204,34,34,.3); }
    .badge-gray { background: rgba(90,90,101,.1);  color: var(--muted); border: 1px solid var(--muted2); }

    .hero-nota {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem; color: var(--cream);
    }
    .hero-nota span { color: var(--red); font-size: 1.5rem; }

    .btn-reservar {
      display: inline-block;
      background: var(--red); color: #fff; border: none;
      padding: .8rem 2rem;
      font-family: 'DM Sans', sans-serif;
      font-size: .82rem; font-weight: 500;
      letter-spacing: .12em; text-transform: uppercase;
      border-radius: 2px; cursor: pointer;
      transition: background .2s, transform .15s;
      text-decoration: none;
    }
    .btn-reservar:hover { background: var(--red-light); transform: translateY(-1px); }

    /* POSTER + INFO */
    .info-section {
      display: flex; gap: 2.5rem;
      padding: 2.5rem 3rem;
      border-bottom: 1px solid var(--muted2);
    }

    .poster-col { flex-shrink: 0; }
    .poster-img {
      width: 180px; height: 260px;
      object-fit: cover; border-radius: 3px;
      border: 1px solid var(--muted2);
      box-shadow: 0 20px 50px rgba(0,0,0,.6);
      margin-top: -80px; position: relative; z-index: 2;
    }

    .info-col { flex: 1; min-width: 0; padding-top: 1rem; }

    .sinopse-label {
      font-size: .6rem; letter-spacing: .2em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: .6rem;
    }

    .sinopse-text {
      font-size: .9rem; line-height: 1.85;
      color: var(--text); margin-bottom: 1.5rem;
    }

    .details-grid {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: .75rem 1.5rem;
    }

    .detail-item label {
      font-size: .58rem; letter-spacing: .15em;
      text-transform: uppercase; color: var(--muted);
      display: block; margin-bottom: .25rem;
    }

    .detail-item p { font-size: .85rem; color: var(--cream); }

    /* CRÍTICAS */
    .criticas-section { padding: 2rem 3rem; }

    .section-label {
      font-size: .6rem; letter-spacing: .2em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: .75rem;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--muted2); }

    .criticas-list { display: flex; flex-direction: column; gap: .75rem; }

    .critica-item {
      background: var(--surface); border: 1px solid var(--muted2);
      border-radius: 3px; padding: 1.1rem 1.25rem;
    }

    .critica-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: .5rem;
    }

    .critica-autor { font-size: .75rem; color: var(--cream); }
    .critica-origem { font-size: .65rem; color: var(--muted); }
    .critica-nota-badge { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; color: var(--red); }

    .critica-msg { font-size: .82rem; color: var(--text); line-height: 1.7; font-style: italic; }

    .no-criticas { font-size: .82rem; color: var(--muted); padding: 1rem 0; font-style: italic; }

    /* EMPTY */
    .detail-placeholder {
      display: flex; align-items: center; justify-content: center;
      height: calc(100vh - 56px);
      flex-direction: column; gap: 1rem; color: var(--muted);
    }
    .detail-placeholder .icon { font-size: 3rem; opacity: .2; }

    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .fade-in { animation: fadeIn .4s ease; }

    @media (max-width: 700px) {
      nav { padding: 1rem 1.25rem; }
      .sidebar { width: 100%; height: auto; position: relative; top: 0; border-right: none; border-bottom: 1px solid var(--muted2); }
      .layout { flex-direction: column; }
      .info-section { flex-direction: column; gap: 1.5rem; padding: 1.5rem; }
      .poster-img { margin-top: -50px; width: 130px; height: 190px; }
      .hero-content { padding: 1.5rem; }
      .details-grid { grid-template-columns: 1fr 1fr; }
      .criticas-section { padding: 1.5rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="#" onclick="goBack()" class="logo">Cine<span>Noir</span></a>
  <a href="#" onclick="goBack()" class="nav-back">← Voltar</a>
</nav>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <p class="sidebar-title">Em Cartaz</p>
    <div id="filmList"></div>
  </aside>

  <!-- DETAIL -->
  <div class="detail" id="detail">
    <div class="detail-placeholder">
      <span class="icon">🎬</span>
      <p>Selecione um filme</p>
    </div>
  </div>
</div>

<script>
const params  = new URLSearchParams(window.location.search);
const usuario = params.get('usuario') || '';
const tipo    = params.get('tipo')    || '';

function goBack() {
  if (usuario) window.location.href = 'index.html?usuario=' + encodeURIComponent(usuario) + '&tipo=' + tipo;
  else window.location.href = 'index.html';
}

let FILMES = [];

async function carregarFilmes() {
  try {
    const res = await fetch('http://localhost:8080/api/filmes/cartaz');
    FILMES = await res.json();
    renderSidebar();
    const filmeParam = params.get('filme');
    if (filmeParam) {
      showFilme(parseInt(filmeParam));
    } else if (FILMES.length > 0) {
      showFilme(FILMES[0].id);
    }
  } catch (err) {
    console.error('Erro ao carregar filmes:', err);
    document.getElementById('filmList').innerHTML =
      '<p style="padding:1rem;color:var(--muted)">Erro ao conectar com o servidor.</p>';
  }
}

// ── RENDER SIDEBAR ──────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('filmList');
  list.innerHTML = FILMES.map(f => `
    <div class="film-thumb-item" id="item-${f.id}" onclick="showFilme(${f.id})">
      <img class="thumb-img" src="${f.posterUrl}" alt="${f.nome}">
      <div style="flex:1;min-width:0;">
        <p class="thumb-info-nome">${f.nome}</p>
        <p class="thumb-info-meta">${f.duracao} · ${f.genero}</p>
      </div>
    </div>`).join('');
}

// ── SHOW FILM ───────────────────────────────────────────────────────────────
async function showFilme(id) {
  const f = FILMES.find(x => x.id === id);
  if (!f) return;

  document.querySelectorAll('.film-thumb-item').forEach(el => el.classList.remove('active'));
  document.getElementById('item-' + id).classList.add('active');

  const reservarUrl = usuario
    ? `index.html?usuario=${encodeURIComponent(usuario)}&tipo=${tipo}#sessions`
    : 'login.html';

  // Busca críticas da API
  let criticas = [];
  try {
    const res = await fetch(`http://localhost:8080/api/criticas/filme/${id}`);
    criticas = await res.json();
  } catch (err) {
    console.error('Erro ao carregar críticas:', err);
  }

  // Calcula nota média
  const nota = criticas.length > 0
    ? (criticas.reduce((sum, c) => sum + c.nota, 0) / criticas.length).toFixed(1)
    : null;

  const criticasHtml = criticas.length === 0
    ? `<p class="no-criticas">Nenhuma crítica publicada ainda.</p>`
    : criticas.map(c => `
        <div class="critica-item">
          <div class="critica-header">
            <div>
              <p class="critica-autor">${c.nome}</p>
              <p class="critica-origem">${c.origem}</p>
            </div>
            <span class="critica-nota-badge">${c.nota}/10</span>
          </div>
          <p class="critica-msg">${c.mensagem}</p>
        </div>`).join('');

  document.getElementById('detail').innerHTML = `
    <div class="fade-in">
      <div class="hero-section">
        <div class="hero-bg" style="background-image:url('${f.cenaUrl || f.posterUrl}');background-position:center"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <p class="hero-genero">${f.genero}</p>
          <h1 class="hero-title">${f.nome}</h1>
          <div class="hero-meta">
            <span>${f.duracao}</span>
            <span class="badge badge-gray">${f.classe || ''}</span>
            ${nota
              ? `<span class="hero-nota"><span>${nota}</span>/10 · ${criticas.length} crítico(s)</span>`
              : `<span class="hero-nota" style="color:var(--muted)">Sem avaliações ainda</span>`
            }
          </div>
          <a href="${reservarUrl}" class="btn-reservar">Reservar Ingresso →</a>
        </div>
      </div>
      <div class="info-section">
        <div class="poster-col">
          <img class="poster-img" src="${f.posterUrl}" alt="${f.nome}">
        </div>
        <div class="info-col">
          <p class="sinopse-label">Sinopse</p>
          <p class="sinopse-text">${f.sinopse}</p>
          <div class="details-grid">
            <div class="detail-item"><label>Diretor</label><p>${f.diretor}</p></div>
            <div class="detail-item"><label>Elenco</label><p>${f.elenco}</p></div>
            <div class="detail-item"><label>Valor base</label><p>R$ ${f.valor.toFixed(2)}</p></div>
          </div>
        </div>
      </div>
      <div class="criticas-section">
        <p class="section-label">Críticas (${criticas.length})</p>
        <div class="criticas-list">${criticasHtml}</div>
      </div>
    </div>`;
}

carregarFilmes();
</script>
</body>
</html>
